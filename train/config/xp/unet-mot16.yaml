# @package _global_

xpname: unet-mot16

datamodule:
  _target_: src.mot16.MOT16DataModule
  # Clear the SLA-specific keys inherited from base.yaml (`input_da` has a
  # `_target_` with mandatory `???` fields, which would otherwise be
  # eagerly instantiated and fail before reaching MOT16DataModule).
  input_da: null
  domains: null
  xrds_kw: null
  norm_stats: null
  path: /Odyssey/private/d22zhu/Lab/images
  mask_path: /SCRATCH/d22zhu/glorys12_2010_2019_daily_sla_4th_input_mask.nc
  mask_var: inp
  patch_dims: ${patch_dims}
  dl_kw: {batch_size: 16, num_workers: 4}
  noise: 0.03

model:
  # MOT16DataModule computes its own norm_stats at setup() time (unlike the
  # SLA datasets, we don't have a static value to interpolate here), so
  # LitModel is left to fetch it from the datamodule at runtime.
  norm_stats: null

defaults:
  - unet
  - _self_
